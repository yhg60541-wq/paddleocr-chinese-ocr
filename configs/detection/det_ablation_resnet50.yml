# ============================================================================
# 03 · 检测头消融 —— 换 ResNet50 Backbone
# ============================================================================
# 对比对象：v3 用 MobileNetV3-L x0.5，本配置换成 ResNet50
# 目的：更大 Backbone 能不能更高精度？
# 结果：精度更高但权重 30MB (v3 是 3.8MB)，考虑部署选 v3
#
# 和 v3 的差异：
#   - pretrained_model: ResNet50_vd_ssld_pretrained
#   - Backbone 换成 ResNet50 (50 层残差块)
#   - epoch_num: 40 (ResNet50 收敛更快)
# ============================================================================

Global:
  model_name: PP-OCRv3_mobile_det
  debug: false
  use_gpu: true
  epoch_num: 40
  log_smooth_window: 20
  print_batch_step: 10
  save_model_dir: ./output/exp_r50/
  save_epoch_step: 100
  eval_batch_step: 100
  cal_metric_during_train: false
  pretrained_model: /root/ResNet50_vd_ssld_pretrained
  checkpoints: null
  save_inference_dir: null
  use_visualdl: false
  infer_img: doc/imgs_en/img_10.jpg
  save_res_path: ./checkpoints/det_db/predicts_db.txt
  distributed: true
  d2s_train_image_shape:
  - 3
  - -1
  - -1
Architecture:
  model_type: det
  algorithm: DB
  Transform: null
  Backbone:
    name: ResNet_vd
    layers: 50
  Neck:
    name: RSEFPN
    out_channels: 256
    shortcut: true
  Head:
    name: DBHead
    k: 50
Loss:
  name: DBLoss
  balance_loss: true
  main_loss_type: DiceLoss
  alpha: 5
  beta: 10
  ohem_ratio: 3
Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.001
    warmup_epoch: 2
  regularizer:
    name: L2
    factor: 5.0e-05
PostProcess:
  name: DBPostProcess
  thresh: 0.3
  box_thresh: 0.6
  max_candidates: 1000
  unclip_ratio: 1.5
Metric:
  name: DetMetric
  main_indicator: hmean
Train:
  dataset:
    name: SimpleDataSet
    data_dir: /root/paddleocr_dataset/det_images/
    label_file_list:
    - /root/paddleocr_dataset/det_images/../det_train_list.txt
    ratio_list:
    - 1.0
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - DetLabelEncode: null
    - IaaAugment:
        augmenter_args:
        - type: Fliplr
          args:
            p: 0.5
        - type: Affine
          args:
            rotate:
            - -10
            - 10
        - type: Resize
          args:
            size:
            - 0.5
            - 3
    - EastRandomCropData:
        size:
        - 960
        - 960
        max_tries: 50
        keep_ratio: true
    - MakeBorderMap:
        shrink_ratio: 0.4
        thresh_min: 0.3
        thresh_max: 0.7
    - MakeShrinkMap:
        shrink_ratio: 0.4
        min_text_size: 8
    - NormalizeImage:
        scale: 1./255.
        mean:
        - 0.485
        - 0.456
        - 0.406
        std:
        - 0.229
        - 0.224
        - 0.225
        order: hwc
    - ToCHWImage: null
    - KeepKeys:
        keep_keys:
        - image
        - threshold_map
        - threshold_mask
        - shrink_map
        - shrink_mask
  loader:
    shuffle: true
    drop_last: false
    batch_size_per_card: 8
    num_workers: 4
Eval:
  dataset:
    name: SimpleDataSet
    data_dir: /root/paddleocr_dataset/det_images/
    label_file_list:
    - /root/paddleocr_dataset/det_images/../det_val_list.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - DetLabelEncode: null
    - DetResizeForTest: null
    - NormalizeImage:
        scale: 1./255.
        mean:
        - 0.485
        - 0.456
        - 0.406
        std:
        - 0.229
        - 0.224
        - 0.225
        order: hwc
    - ToCHWImage: null
    - KeepKeys:
        keep_keys:
        - image
        - shape
        - polys
        - ignore_tags
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 1
    num_workers: 2
profiler_options: null
