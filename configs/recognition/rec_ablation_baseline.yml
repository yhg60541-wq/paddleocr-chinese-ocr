# ============================================================================
# 06 · 识别头消融 —— Baseline 版 <- Val Acc=33.8% (灾难级)
# ============================================================================
# 两个致命问题：
#   1. image_shape=[3,32,100] 宽度 100px，46.7% 长文字被截断！
#   2. 预训练 171 处 shape mismatch，等于白加载
# 过拟合 Gap: 35.3% (严重)
#
# 和 EXP-v4 的差异：
#   - Backbone: MBV3 -> ResNet34
#   - image_shape: 100px -> 320px (最大贡献)
#   - 预训练: mobile -> Server 6.3万
# ============================================================================

Global:
  epoch_num: 50
  log_smooth_window: 20
  print_batch_step: 10
  save_model_dir: ./output/rec_custom/
  save_epoch_step: 5
  eval_batch_step: [0, 300]
  cal_metric_during_train: true
  pretrained_model: /root/PaddleOCR/output/rec_custom/iter_epoch_45.pdparams
  use_gpu: true
  seed: 1024
Optimizer:
  name: Adam
  lr:
    name: Cosine
    learning_rate: 0.00005
    warmup_epoch: 0
  regularizer:
    name: L2
    factor: 3.0e-05
Architecture:
  model_type: rec
  algorithm: CRNN
  Backbone:
    name: MobileNetV3
    scale: 1.0
    model_name: large
  Neck:
    name: SequenceEncoder
    encoder_type: rnn
    hidden_size: 48
  Head:
    name: CTCHead
    fc_decay: 5.0e-04
    character_dict_path: /root/rec_dataset/dict_char.txt
Loss:
  name: CTCLoss
PostProcess:
  name: CTCLabelDecode
  character_dict_path: /root/rec_dataset/dict_char.txt
  use_space_char: false
Metric:
  name: RecMetric
  main_indicator: acc
  character_dict_path: /root/rec_dataset/dict_char.txt
  use_space_char: false
Train:
  dataset:
    name: SimpleDataSet
    data_dir: /root/rec_dataset/
    label_file_list: [/root/rec_dataset/rec_gt_train.txt]
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - CTCLabelEncode:
          max_text_length: 25
          character_dict_path: /root/rec_dataset/dict_char.txt
          use_space_char: false
      - RecResizeImg:
          image_shape: [3, 32, 100]
      - KeepKeys:
          keep_keys: [image, label, length, valid_ratio]
  loader:
    shuffle: true
    batch_size_per_card: 128
    drop_last: true
    num_workers: 4
Eval:
  dataset:
    name: SimpleDataSet
    data_dir: /root/rec_dataset/
    label_file_list: [/root/rec_dataset/rec_gt_val.txt]
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - CTCLabelEncode:
          max_text_length: 25
          character_dict_path: /root/rec_dataset/dict_char.txt
          use_space_char: false
      - RecResizeImg:
          image_shape: [3, 32, 100]
      - KeepKeys:
          keep_keys: [image, label, length, valid_ratio]
  loader:
    shuffle: false
    batch_size_per_card: 128
    drop_last: false
    num_workers: 4
